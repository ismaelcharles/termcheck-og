{% from 'fichas.html' import fichas %}
<div class="section-heading"><h1>Glosario O&G</h1><a class="button quiet" href="glosario.csv" download>Descargar CSV</a></div>
<form class="catalog-search" hx-get="glosario" hx-target="#browse-panel"><label>Buscar en inglés o español<input type="search" name="q" value="{{ q }}" maxlength="200" placeholder="Término, variante o nota"></label><label>Área<select name="area"><option value="">Todas las áreas</option>{% for a in areas %}<option {% if area == a %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></label><button class="primary">Buscar</button></form>
<p class="muted">{{ total }} términos · Página {{ numero }} de {{ paginas }}</p>{{ fichas(terminos) }}{% if not terminos %}<p>No encontré términos con esa búsqueda.</p>{% endif %}
<form class="pagination" hx-get="glosario" hx-target="#browse-panel"><input type="hidden" name="q" value="{{ q }}"><input type="hidden" name="area" value="{{ area }}"><button name="pagina" value="{{ numero-1 }}" {% if numero == 1 %}disabled{% endif %}>Anterior</button><span>{{ numero }} / {{ paginas }}</span><button name="pagina" value="{{ numero+1 }}" {% if numero == paginas %}disabled{% endif %}>Siguiente</button></form>
