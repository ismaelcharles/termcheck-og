<h1>Ejemplos</h1><p class="muted">Probá cómo cambian las marcas al editar una traducción.</p>
{% for ej in ejemplos %}<details class="example" {% if loop.first %}open{% endif %}><summary>{{ ej.titulo }}</summary><p lang="en">{{ ej.original }}</p><form hx-post="ejemplo" hx-target="#ejemplo-{{ loop.index0 }}"><input type="hidden" name="indice" value="{{ loop.index0 }}"><label>Probá otra traducción<textarea name="traduccion" rows="3" maxlength="1500">{{ ej.traduccion }}</textarea></label><button class="primary">Probar traducción</button></form><div id="ejemplo-{{ loop.index0 }}" aria-live="polite"></div></details>{% endfor %}
